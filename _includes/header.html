<header class="site-header">
  <div class="wrapper site-bar">
    <a class="brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <span class="brand-icon" aria-hidden="true"></span>{{ site.title | escape }}
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>归档</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
    </nav>
  </div>
</header>
